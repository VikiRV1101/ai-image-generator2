<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Generator</title>
  <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { font-family: sans-serif; background-color: #f3f4f6; }
    textarea { resize: none; }
    img:hover { cursor: pointer; }
  </style>
</head>
<body class="max-w-4xl mx-auto p-4">
  <div class="text-center">
    <h1 class="text-4xl font-bold mb-6">AI Image Generator</h1>
    <p class="mb-6">⚠️ Enter your own <b>OpenAI API key</b> below. Do not share it with anyone.</p>
  </div>

  <div class="bg-white shadow-md rounded-lg p-6">
    <label for="api" class="text-gray-700">OpenAI API Key</label>
    <input id="api" type="text" class="border rounded p-2 w-full mb-4" placeholder="Enter your API key" />

    <label for="text" class="text-gray-700">Description / Keyword</label>
    <textarea id="text" class="border rounded p-2 w-full mb-4" placeholder="Enter description"></textarea>

    <label for="sizeSelect" class="text-gray-700">Image Size</label>
    <select id="sizeSelect" class="border rounded p-2 w-full mb-4">
      <option value="256">256x256</option>
      <option value="512" selected>512x512</option>
      <option value="1024">1024x1024</option>
    </select>

    <label for="numImagesSelect" class="text-gray-700">Number of Images</label>
    <select id="numImagesSelect" class="border rounded p-2 w-full mb-4">
      <option value="1" selected>1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>

    <button id="btn" class="bg-blue-600 text-white px-4 py-2 rounded">Generate</button>

    <div id="loading" class="hidden mt-6 text-center">
      <p>Loading...</p>
    </div>

    <div id="image" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mt-6"></div>
  </div>

  <footer class="text-center mt-10 border-t pt-4">
    Made with ❤️ by VIKI
  </footer>

  <script>
    const apiInput = document.getElementById("api");
    const text = document.getElementById("text");
    const image = document.getElementById("image");
    const btn = document.getElementById("btn");
    const sizeSelect = document.getElementById("sizeSelect");
    const numImagesSelect = document.getElementById("numImagesSelect");
    const loadingSpinner = document.getElementById("loading");

    let imageSize = sizeSelect.value;
    let numImages = parseInt(numImagesSelect.value);

    sizeSelect.addEventListener("change", () => imageSize = sizeSelect.value);
    numImagesSelect.addEventListener("change", () => numImages = parseInt(numImagesSelect.value));

    btn.addEventListener("click", async () => {
      const apiKey = apiInput.value.trim();
      if (!apiKey) {
        alert("Please enter your OpenAI API key.");
        return;
      }

      if (!text.value.trim()) {
        alert("Please enter a description.");
        return;
      }

      loadingSpinner.classList.remove("hidden");
      btn.disabled = true;
      image.innerHTML = "";

      try {
        const response = await fetch("https://api.openai.com/v1/images/generations", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            prompt: text.value,
            n: numImages,
            size: `${imageSize}x${imageSize}`
          })
        });

        const data = await response.json();

        if (data.data) {
          data.data.forEach(item => {
            const img = document.createElement("img");
            img.src = item.url;
            img.alt = "Generated image";
            img.className = "w-full h-auto rounded shadow hover:shadow-2xl transition duration-300";

            // Double-click to download
            img.addEventListener("dblclick", () => {
              const link = document.createElement("a");
              link.href = item.url;
              link.download = text.value.trim().split(" ").join("_") + ".png";
              link.click();
            });

            image.appendChild(img);
          });
        } else {
          alert("Error generating images.");
          console.log(data);
        }

      } catch (err) {
        console.error(err);
        alert("Something went wrong!");
      } finally {
        loadingSpinner.classList.add("hidden");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
